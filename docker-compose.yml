services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: erakshak
      POSTGRES_PASSWORD: erakshak_dev
      POSTGRES_DB: erakshak
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erakshak -d erakshak"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://erakshak:erakshak_dev@db:5432/erakshak
      JWT_SECRET: change-me
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 480
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_USE_MOCKS: "false"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
