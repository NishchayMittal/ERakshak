services:
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////app/erakshak.db
      JWT_SECRET: change-me
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 480
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_USE_MOCKS: "false"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
