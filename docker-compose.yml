# Development docker-compose — uses Vite dev server with hot-reload
# For production, use: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: sqlite:////app/erakshak.db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 480
      CORS_ORIGINS: "*"
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - redis

  worker:
    build:
      context: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: sqlite:////app/erakshak.db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - api

  frontend:
    build:
      context: ./frontend
      target: build
    command: npx vite --host 0.0.0.0 --port 5173
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_API_BASE_URL: http://localhost:8000
      VITE_USE_MOCKS: "false"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
