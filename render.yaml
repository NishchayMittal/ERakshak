services:
  - type: web
    name: erakshak-api
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: 480
      - key: DEBUG
        value: "False"
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
    disk:
      name: erakshak-uploads-disk
      mountPath: /app/app/resources/uploads
      sizeGB: 1
